services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: almacenia_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:

# Ollama corre nativo en Windows (no en Docker), reusando la instalación y los modelos
# ya existentes con acceso directo a la GPU. Ver README.md de esta carpeta.
